name: BQ CD

on:
  workflow_dispatch:
    inputs:
      dataset_folder:
        description: "Dataset folder to deploy"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # ✅ Install yq (YAML parser)
      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      # 🔥 Execute YAML-driven scripts
      - name: Execute SQL from YAML
        run: |
          BASE="${{ github.event.inputs.dataset_folder }}"
          CONFIG="$BASE/script_execution.yml"

          if [ ! -f "$CONFIG" ]; then
            echo "❌ script_execution.yml not found"
            exit 1
          fi

          echo "📂 Reading config: $CONFIG"

          SCRIPTS=$(yq e '.scripts[]' $CONFIG)

          for script in $SCRIPTS
          do
            FILE="$BASE/$script"

            if [ ! -f "$FILE" ]; then
              echo "❌ Missing file: $FILE"
              exit 1
            fi

            echo "🚀 Running: $FILE"
            bq query --use_legacy_sql=false < "$FILE"
          done

          echo "✅ Deployment complete"