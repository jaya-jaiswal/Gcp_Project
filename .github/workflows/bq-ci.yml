name: BQ CI

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate config
        run: |
          if [ ! -f "script_execution.yml" ]; then
            echo "❌ script_execution.yml missing"
            exit 1
          fi

          echo "✅ Config present"